name: Windows CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan new commits for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-and-package:
    needs: secret-scan
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Windows distributions
        run: npm run package

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $smokeData = Join-Path $env:RUNNER_TEMP 'eyeprotect-smoke-data'
          New-Item -ItemType Directory -Path $smokeData -Force | Out-Null
          $env:EYEPROTECT_DATA_DIR = $smokeData
          $env:EYEPROTECT_SMOKE = '1'
          $executable = Join-Path $env:GITHUB_WORKSPACE 'release\win-unpacked\EyeProtect.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--remote-debugging-port=9333' -PassThru -WindowStyle Hidden
          try {
            npm run smoke:running -- 9333
            npm run smoke:experience -- 9333
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test emergency reminder fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $smokeData = Join-Path $env:RUNNER_TEMP 'eyeprotect-emergency-smoke-data'
          New-Item -ItemType Directory -Path $smokeData -Force | Out-Null
          $env:EYEPROTECT_DATA_DIR = $smokeData
          $env:EYEPROTECT_SMOKE = '1'
          $executable = Join-Path $env:GITHUB_WORKSPACE 'release\win-unpacked\EyeProtect.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--remote-debugging-port=9334', '--eyeprotect-smoke-emergency' -PassThru -WindowStyle Hidden
          try {
            npm run smoke:emergency -- 9334
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test pet renderer startup isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $smokeData = Join-Path $env:RUNNER_TEMP 'eyeprotect-pet-failure-smoke-data'
          New-Item -ItemType Directory -Path $smokeData -Force | Out-Null
          $env:EYEPROTECT_DATA_DIR = $smokeData
          $env:EYEPROTECT_SMOKE = '1'
          $executable = Join-Path $env:GITHUB_WORKSPACE 'release\win-unpacked\EyeProtect.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--remote-debugging-port=9335', '--eyeprotect-smoke-pet-failure' -PassThru -WindowStyle Hidden
          try {
            npm run smoke:pet-failure -- 9335
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: EyeProtect-Windows-x64
          path: |
            release/EyeProtect-Setup-1.1.0-win-x64.exe
            release/EyeProtect-1.1.0-win-x64-portable.exe
          if-no-files-found: error
