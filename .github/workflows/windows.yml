name: Windows CI

on:
  push:
  pull_request:

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build NSIS installer
        run: npm run package:nsis

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $smokeData = Join-Path $env:RUNNER_TEMP 'eyeprotect-smoke-data'
          New-Item -ItemType Directory -Path $smokeData -Force | Out-Null
          $env:EYEPROTECT_DATA_DIR = $smokeData
          $executable = Join-Path $env:GITHUB_WORKSPACE 'release\win-unpacked\EyeProtect.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--remote-debugging-port=9333' -PassThru -WindowStyle Hidden
          try {
            npm run smoke:running -- 9333
            npm run smoke:experience -- 9333
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EyeProtect-Windows-Installer
          path: release/EyeProtect-Setup-1.1.0-win-x64.exe
          if-no-files-found: error
