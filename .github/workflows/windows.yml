name: Windows CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan new commits for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-and-package:
    needs: secret-scan
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify UI contract
        run: npm run verify:ui-contract

      - name: Build
        run: npm run build

      - name: Build Windows distributions
        run: npm run package

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $smokeData = Join-Path $env:RUNNER_TEMP 'eyeprotect-smoke-data'
          New-Item -ItemType Directory -Path $smokeData -Force | Out-Null
          $env:EYEPROTECT_DATA_DIR = $smokeData
          $env:EYEPROTECT_SMOKE = '1'
          $snapshotDir = Join-Path $env:RUNNER_TEMP 'eyeprotect-ui-snapshots'
          $executable = Join-Path $env:GITHUB_WORKSPACE 'release\win-unpacked\EyeProtect.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--remote-debugging-port=9333' -PassThru -WindowStyle Hidden
          try {
            npm run smoke:running -- 9333
            npm run smoke:experience -- 9333
            npm run capture:ui -- 9333 $snapshotDir
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload UI snapshots
        uses: actions/upload-artifact@v7
        with:
          name: EyeProtect-UI-snapshots
          path: ${{ runner.temp }}/eyeprotect-ui-snapshots/*.png
          if-no-files-found: error

      - name: Capture Windows scale-factor matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $snapshotDir = Join-Path $env:RUNNER_TEMP 'eyeprotect-ui-snapshots'
          $executable = Join-Path $env:GITHUB_WORKSPACE 'release\win-unpacked\EyeProtect.exe'
          $matrix = @(
            @{ Label = '100'; Scale = 1.0; Port = 9340 },
            @{ Label = '125'; Scale = 1.25; Port = 9341 },
            @{ Label = '150'; Scale = 1.5; Port = 9342 },
            @{ Label = '200'; Scale = 2.0; Port = 9343 }
          )
          foreach ($entry in $matrix) {
            $env:EYEPROTECT_DATA_DIR = Join-Path $env:RUNNER_TEMP "eyeprotect-scale-$($entry.Label)"
            New-Item -ItemType Directory -Path $env:EYEPROTECT_DATA_DIR -Force | Out-Null
            $process = Start-Process -FilePath $executable -ArgumentList "--remote-debugging-port=$($entry.Port)", "--force-device-scale-factor=$($entry.Scale)" -PassThru -WindowStyle Hidden
            try {
              node scripts/capture-ui-scale.mjs $entry.Port $snapshotDir $entry.Label $entry.Scale
            } finally {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload scale-factor snapshots
        uses: actions/upload-artifact@v7
        with:
          name: EyeProtect-UI-scale-snapshots
          path: ${{ runner.temp }}/eyeprotect-ui-snapshots/*scale-*.png
          if-no-files-found: error

      - name: Smoke test emergency reminder fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $smokeData = Join-Path $env:RUNNER_TEMP 'eyeprotect-emergency-smoke-data'
          New-Item -ItemType Directory -Path $smokeData -Force | Out-Null
          $env:EYEPROTECT_DATA_DIR = $smokeData
          $env:EYEPROTECT_SMOKE = '1'
          $executable = Join-Path $env:GITHUB_WORKSPACE 'release\win-unpacked\EyeProtect.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--remote-debugging-port=9334', '--eyeprotect-smoke-emergency' -PassThru -WindowStyle Hidden
          try {
            npm run smoke:emergency -- 9334
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test pet renderer startup isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $smokeData = Join-Path $env:RUNNER_TEMP 'eyeprotect-pet-failure-smoke-data'
          New-Item -ItemType Directory -Path $smokeData -Force | Out-Null
          $env:EYEPROTECT_DATA_DIR = $smokeData
          $env:EYEPROTECT_SMOKE = '1'
          $executable = Join-Path $env:GITHUB_WORKSPACE 'release\win-unpacked\EyeProtect.exe'
          $process = Start-Process -FilePath $executable -ArgumentList '--remote-debugging-port=9335', '--eyeprotect-smoke-pet-failure' -PassThru -WindowStyle Hidden
          try {
            npm run smoke:pet-failure -- 9335
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: EyeProtect-Windows-x64
          path: |
            release/EyeProtect-Setup-1.1.0-win-x64.exe
            release/EyeProtect-1.1.0-win-x64-portable.exe
          if-no-files-found: error
