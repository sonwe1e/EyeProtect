name: Windows CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan new commits for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-and-package:
    needs: secret-scan
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test renderer contracts
        run: npm test
      - name: Verify product and UI contracts
        run: npm run lint
      - name: Test Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows distributions
        run: npm run package
      # WebView2 150+ ignores environment-based debugging and profile
      # overrides in elevated hosts. Hosted Windows runners are elevated, so
      # scope these machine policies to our executable on the disposable VM.
      - name: Configure WebView2 for isolated CI automation
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $root = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2'
          New-Item -Path "$root\AdditionalBrowserArguments" -Force | Out-Null
          New-Item -Path "$root\UserDataFolder" -Force | Out-Null
          New-ItemProperty -Path "$root\AdditionalBrowserArguments" -Name 'eyeprotect.exe' -PropertyType String -Value "--remote-debugging-port=$port" -Force | Out-Null
          New-ItemProperty -Path "$root\UserDataFolder" -Name 'eyeprotect.exe' -PropertyType String -Value (Join-Path $env:RUNNER_TEMP 'eyeprotect-ui-profile') -Force | Out-Null
          "EYEPROTECT_TAURI_CDP_PORT=$port" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test Tauri windows
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\UserDataFolder' -Name 'eyeprotect.exe' -Value (Join-Path $env:RUNNER_TEMP 'eyeprotect-ui-profile')
          npm run smoke:tauri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test write failures
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\UserDataFolder' -Name 'eyeprotect.exe' -Value (Join-Path $env:RUNNER_TEMP 'eyeprotect-write-profile')
          npm run smoke:tauri-write-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test task notifications
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\UserDataFolder' -Name 'eyeprotect.exe' -Value (Join-Path $env:RUNNER_TEMP 'eyeprotect-notification-profile')
          npm run smoke:tauri-task-reminder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test startup with damaged data
        run: npm run smoke:tauri-startup-recovery
      - name: Install and test the packaged application
        shell: pwsh
        run: |
          $installer = Get-Item release/EyeProtect-Setup-*-win-x64.exe
          $installDir = Join-Path $env:RUNNER_TEMP 'EyeProtect-2.0'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $exe = Get-ChildItem -Path $installDir -Filter eyeprotect.exe -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Installed application was not found' }
          $env:EYEPROTECT_TAURI_EXE = $exe.FullName
          Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\UserDataFolder' -Name 'eyeprotect.exe' -Value (Join-Path $env:RUNNER_TEMP 'eyeprotect-installed-profile')
          npm run smoke:tauri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:EYEPROTECT_TEST_INSTALLED_NOTIFICATIONS = '1'
          Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\UserDataFolder' -Name 'eyeprotect.exe' -Value (Join-Path $env:RUNNER_TEMP 'eyeprotect-installed-notification-profile')
          npm run smoke:tauri-task-reminder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove CI-only WebView2 policies
        if: always()
        shell: pwsh
        run: |
          $root = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2'
          Remove-ItemProperty -Path "$root\AdditionalBrowserArguments" -Name 'eyeprotect.exe' -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path "$root\UserDataFolder" -Name 'eyeprotect.exe' -ErrorAction SilentlyContinue
      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: EyeProtect-Tauri-interaction
          path: artifacts/codex-tauri-ui/*.png
          if-no-files-found: warn
      - name: Upload Windows distributions
        uses: actions/upload-artifact@v7
        with:
          name: EyeProtect-Windows-x64
          path: |
            release/EyeProtect-Setup-*-win-x64.exe
            release/EyeProtect-*-win-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
