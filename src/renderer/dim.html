<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Focused-rest dim mask: an opaque-black page dimmed by CSS alpha.
         Electron used an opaque window + setOpacity(0.55); Tauri renders the
         same 55 % black wash with a transparent window instead. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>EyeProtect</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body></body>
</html>
